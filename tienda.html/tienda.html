<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tienda – PackImpresión</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
.fade-in {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 0.6s ease forwards;
}
@keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
}
.product-card { transition: 0.3s ease; }
.product-card:hover { transform: translateY(-6px); }

.add-pop {
    animation: popAdd 0.3s ease;
}

@keyframes popAdd {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

#toast.show {
    opacity: 1;
    transform: translate(-50%, 10px);
}

.cart-anim {
    animation: cartOpen 0.35s ease;
}

@keyframes cartOpen {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}





</style>

</head>

<body class="bg-gray-50">

<header class="py-6 bg-white shadow-sm fade-in">
    <div class="container mx-auto text-center">
        <img src="/logo.png" class="w-40 mx-auto">
        <h1 class="text-2xl font-bold text-[#0077cc] mt-2">Tienda PackImpresión</h1>
        <p class="text-gray-600">Llaveros, cuadros y regalos personalizados</p>
    </div>
    
</header>

<section class="py-12 fade-in">
    <div id="tienda" class="container mx-auto grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</section>

<!-- CARRITO FLOTANTE -->
<div id="cartBox"
     class="fixed bottom-24 right-4 bg-white shadow-2xl rounded-2xl p-4 w-72 hidden border border-gray-200 z-[999]">
    <h3 class="text-lg font-bold mb-3">Carrito</h3>

    <ul id="cartItems" class="text-sm text-gray-700 space-y-2"></ul>

    <p id="cartTotal" class="font-bold text-[#0077cc] mt-3"></p>

    <button onclick="sendCartWhatsApp()"
            class="w-full mt-4 bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-2 rounded-xl transition">
        Enviar pedido por WhatsApp
    </button>
    <button onclick="vaciarCarrito()"
        class="w-full mt-2 bg-red-500 hover:bg-red-600 text-white font-semibold py-2 rounded-xl transition">
    Vaciar carrito
</button>

</div>

<!-- BOTÓN FLOTANTE DEL CARRITO -->
<button onclick="toggleCart()"
        class="fixed bottom-4 right-4 bg-[#0077cc] text-white w-16 h-16 rounded-full shadow-xl text-3xl flex items-center justify-center z-[999999]">
    🛒
    <span id="cartCount"
          class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full">
        0
    </span>
</button>

<audio id="addSound" src="/tienda.html/sounds/add.mp3" preload="auto"></audio>

<script>
/* ===========================
   SONIDO AL AÑADIR
   =========================== */
function playAddSound() {
    const sound = document.getElementById("addSound");
    sound.currentTime = 0;
    sound.play();
}

/* ===========================
   PRODUCTOS
   =========================== */
const productos = [
    { nombre: "Llavero Personalizado", precio: 4, img: "/img/llavero1.jpg", etiqueta: "Más vendido" },
    { nombre: "Llavero Metálico Premium", precio: 6, img: "/img/llavero2.jpg", etiqueta: "Nuevo" },
    { nombre: "Cuadro Decorativo A4", precio: 12, img: "/img/cuadro1.jpg", etiqueta: "Oferta" },
    { nombre: "Cuadro Decorativo A3", precio: 18, img: "/img/cuadro2.jpg", etiqueta: "Popular" },
    { nombre: "Foto Imán", precio: 3, img: "/img/regalo1.jpg", etiqueta: "Más vendido" },
    { nombre: "Mini Cuadro", precio: 7, img: "/img/regalo2.jpg", etiqueta: "Nuevo" },
    { nombre: "Foto en Madera", precio: 15, img: "/img/regalo3.jpg", etiqueta: "Premium" },
    { nombre: "Foto en Acrílico", precio: 20, img: "/img/regalo4.jpg", etiqueta: "Oferta" },
    { nombre: "Foto en Cristal", precio: 25, img: "/img/regalo5.jpg", etiqueta: "Exclusivo" },
    { nombre: "Marco Premium", precio: 30, img: "/img/regalo6.jpg", etiqueta: "Nuevo" }
];

/* ===========================
   GENERAR TIENDA
   =========================== */
function generarProductos() {
    const tienda = document.getElementById("tienda");
    tienda.innerHTML = "";

    productos.forEach((p) => {
        tienda.innerHTML += `
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden border-t-4 border-[#0077cc] product-card fade-in relative">

            <span class="absolute bg-emerald-500 text-white text-xs font-semibold px-3 py-1 rounded-br-xl">${p.etiqueta}</span>

            <img src="${p.img}" class="w-full h-40 object-cover">

            <div class="p-4">
                <h3 class="text-lg font-semibold mb-1">${p.nombre}</h3>
                <p class="text-gray-600 text-sm mb-2">Producto personalizado PackImpresión.</p>
                <p class="text-xl font-bold text-[#0077cc] mb-3">${p.precio} €</p>

                <button onclick="addToCartQty('${p.nombre}', ${p.precio}, this)"
                        class="add-btn w-full bg-[#0077cc] hover:bg-[#005fa3] text-white font-semibold py-2 rounded-xl transition">
                    Añadir al carrito
                </button>
            </div>
        </div>`;
    });
}

generarProductos();

/* ===========================
   CARRITO
   =========================== */
let cart = JSON.parse(localStorage.getItem('cartPackImpresion') || '[]');

function addToCartQty(name, price, btn) {

    // Animación POP
    btn.classList.add("add-pop");
    setTimeout(() => btn.classList.remove("add-pop"), 300);

    // Sonido
    playAddSound();

    // Añadir al carrito
    const existingItem = cart.find(item => item.name === name);

    if (existingItem) {
        existingItem.quantity += 1;
    } else {
        cart.push({ name, price, quantity: 1 });
    }

    localStorage.setItem('cartPackImpresion', JSON.stringify(cart));
    updateCartUI();
    updateCartCount();
    showToast(`${name} añadido al carrito`);
    showCart();
}

function updateCartUI() {
    const list = document.getElementById('cartItems');
    list.innerHTML = "";

    if (cart.length === 0) {
        list.innerHTML = `<li class="text-gray-400 text-center py-4">El carrito está vacío</li>`;
        return;
    }

    cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;

        list.innerHTML += `
            <li class="flex justify-between items-center border-b pb-2">
                <div>
                    <span class="font-semibold block">${item.name}</span>
                    <span class="text-xs text-gray-500">${item.quantity} x ${item.price.toFixed(2)} € = ${itemTotal.toFixed(2)} €</span>
                </div>

                <div class="flex items-center gap-2">
                    <button class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded font-bold text-xs"
                            onclick="updateItemQuantity(${index}, -1)">-</button>

                    <span class="text-xs font-semibold">${item.quantity}</span>

                    <button class="w-6 h-6 bg-gray-100 hover:bg-gray-200 rounded font-bold text-xs"
                            onclick="updateItemQuantity(${index}, 1)">+</button>

                    <button class="text-red-500 hover:text-red-700 font-bold px-1 ml-1"
                            onclick="removeItem(${index})">✕</button>
                </div>
            </li>`;
    });

    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    document.getElementById('cartTotal').textContent = "Total: " + total.toFixed(2) + " €";
}

function updateItemQuantity(index, amount) {
    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    localStorage.setItem('cartPackImpresion', JSON.stringify(cart));
    updateCartUI();
    updateCartCount();
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem('cartPackImpresion', JSON.stringify(cart));
    updateCartUI();
    updateCartCount();
}

/* ===========================
   CARRITO FLOTANTE
   =========================== */
function toggleCart() {
    document.getElementById('cartBox').classList.toggle('hidden');
}

function showCart() {
    const cartBox = document.getElementById('cartBox');
    cartBox.classList.remove('hidden');
    cartBox.classList.add('cart-anim');
    setTimeout(() => cartBox.classList.remove('cart-anim'), 350);
}

/* ===========================
   WHATSAPP
   =========================== */
function sendCartWhatsApp() {
    if (cart.length === 0) return;

    let msg = "🧾 *Ticket de Pedido – PackImpresión*%0A";
    msg += "------------------------------------%0A%0A";

    cart.forEach(item => {
        const subtotal = item.price * item.quantity;

        msg += `📦 *${item.name}*%0A`;
        msg += `   Cantidad: ${item.quantity}%0A`;
        msg += `   Precio unidad: ${item.price.toFixed(2)} €%0A`;
        msg += `   Subtotal: ${subtotal.toFixed(2)} €%0A%0A`;
    });

    msg += "------------------------------------%0A";

    const total = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
    msg += `🧮 *Total a pagar:* ${total.toFixed(2)} €%0A`;
    msg += "------------------------------------%0A%0A";
    msg += "📲 Gracias por su pedido";

    window.open("https://wa.me/34684792506?text=" + msg, "_blank");
}

/* ===========================
   CONTADOR DEL CARRITO
   =========================== */
function updateCartCount() {
    const count = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById("cartCount").textContent = count;
}

/* ===========================
   TOAST
   =========================== */
function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 1800);
}

/* ===========================
   VACIAR CARRITO
   =========================== */
function vaciarCarrito() {
    cart = [];
    localStorage.setItem('cartPackImpresion', JSON.stringify(cart));
    updateCartUI();
    updateCartCount();
    showToast("Carrito vaciado");
}
</script>


<div id="toast"
     class="fixed top-4 left-1/2 -translate-x-1/2 bg-black text-white px-4 py-2 rounded-xl opacity-0 transition z-[999999]">
</div>

<section id="mis-pedidos" class="hidden container mx-auto p-6">
    <h2 class="text-2xl font-bold mb-4 text-[#0077cc]">Mis pedidos</h2>
    <ul id="listaPedidos" class="space-y-4"></ul>
</section>


</body>
</html>
