<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Pack Impresión</title>
<style>
  body { font-family: Arial; max-width: 600px; margin: auto; padding: 20px; }
  input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; }
  button { padding: 12px; background: #007bff; color: white; border: none; width: 100%; }
</style>
</head>

<body>

<h2>Registrar Trabajo</h2>

<label>Cliente (email o teléfono)</label>
<input id="cliente" type="text">

<label>Tipo de trabajo</label>
<select id="tipo">
  <option value="Impresión">Impresión</option>
  <option value="Ampliación">Ampliación</option>
  <option value="Revelado">Revelado</option>
  <option value="Fotocopia">Fotocopia</option>
  <option value="Otro">Otro</option>
</select>

<label>Tamaño / Pack</label>
<select id="tamano" onchange="calcularPrecio()">
  <option value="">Seleccionar…</option>

  <!-- Tamaños normales -->
  <option value="10x15">10x15</option>
  <option value="13x18">13x18</option>
  <option value="15x20">15x20</option>
  <option value="20x30">20x30</option>

  <!-- Packs especiales -->
  <option value="PACK_10x15_10">Pack 10x15 (10 fotos)</option>
  <option value="PACK_10x15_22">Pack 10x15 (22 fotos)</option>
</select>

<label>Cantidad</label>
<input id="cantidad" type="number" value="1" min="1" oninput="calcularPrecio()">

<label>Precio total (€)</label>
<input id="precio" type="number" step="0.01" readonly>

<label>Notas</label>
<textarea id="notas"></textarea>

<label>Fotos (URL de WhatsApp Web o Drive)</label>
<input id="foto" type="text">

<button onclick="registrarTrabajo()">Registrar</button>

<p id="msg"></p>

<script>
function calcularPrecio() {
  const tamano = document.getElementById("tamano").value;
  const cantidad = parseInt(document.getElementById("cantidad").value || "1", 10);
  let precioBase = 0;

  // Precios de packs (precio por pack)
  if (tamano === "PACK_10x15_10") precioBase = 5;   // 5 € por pack de 10 fotos
  if (tamano === "PACK_10x15_22") precioBase = 10;  // 10 € por pack de 22 fotos

  // Precios de tamaños normales (precio por foto)
  if (tamano === "10x15") precioBase = 0.50;
  if (tamano === "13x18") precioBase = 0.80;
  if (tamano === "15x20") precioBase = 1.00;
  if (tamano === "20x30") precioBase = 2.00;

  const precioTotal = precioBase * cantidad;
  document.getElementById("precio").value = precioTotal.toFixed(2);
}

function registrarTrabajo() {

  const payload = {
    cliente: document.getElementById("cliente").value,
    tipo: document.getElementById("tipo").value,
    tamano: document.getElementById("tamano").value,
    precio: document.getElementById("precio").value,
    estado: "En producción",
    notas: document.getElementById("notas").value,
    foto: document.getElementById("foto").value,
    registrado_por: "Reinier",
    cantidad: document.getElementById("cantidad").value
  };

  fetch("https://script.google.com/macros/s/AKfycbyd9icKBo6V2TWpWUfheaccUQwCYSs4o7cYTxDJ6qHrhDZ0i3HXDCV5Z5E64gmF7vyZFg/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    document.getElementById("msg").innerText = "Trabajo registrado correctamente";
  })
  .catch(() => {
    document.getElementById("msg").innerText = "Error al registrar";
  });
}
</script>

</body>
</html>
